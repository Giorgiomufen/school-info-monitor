<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tehnikagümnaasium - News</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        /* Space background */
        .space-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background:
                linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.6) 100%),
                url('https://eoimages.gsfc.nasa.gov/images/imagerecords/79000/79790/city_lights_europe_lrg.jpg');
            background-size: cover;
            background-position: center;
            filter: brightness(0.7);
        }

        .container {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 40px 60px;
        }

        header {
            margin-bottom: 30px;
        }

        /* Top Timeline */
        .top-timeline {
            position: relative;
            padding: 0 60px;
        }

        .top-timeline-track {
            position: relative;
            height: 4px;
            background: rgba(255,255,255,0.15);
        }

        .top-timeline-periods {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            display: flex;
        }

        .top-timeline-period {
            height: 100%;
            background: rgba(255,255,255,0.3);
        }

        .top-timeline-period.active {
            background: white;
        }

        .top-timeline-break {
            height: 100%;
            background: transparent;
        }

        .top-timeline-progress {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: white;
        }

        .top-timeline-marker {
            position: absolute;
            top: -8px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 20px rgba(255,255,255,0.8);
        }

        .top-timeline-labels {
            position: relative;
            height: 20px;
            margin-top: 12px;
            font-size: 0.75rem;
            opacity: 0.5;
            letter-spacing: 1px;
        }

        .top-timeline-now {
            position: absolute;
            top: -24px;
            left: -50px;
            right: -50px;
            text-align: center;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.7;
            white-space: nowrap;
        }

        .main-content {
            flex: 1;
            display: flex;
            gap: 40px;
            min-height: 0;
            overflow: hidden;
        }

        /* Vertical progress bar */
        .progress-vertical {
            width: 2px;
            background: rgba(255,255,255,0.15);
            overflow: hidden;
        }

        .progress-vertical .bar {
            width: 100%;
            background: white;
            height: 0%;
            transition: height 0.3s ease;
        }

        /* News scroll area */
        .news-scroll-container {
            flex: 3;
            overflow: hidden;
            position: relative;
        }

        .news-scroll {
            display: flex;
            flex-direction: column;
            gap: 60px;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .news-item {
            display: flex;
            gap: 50px;
            align-items: center;
        }

        .news-image {
            flex: 1;
            max-width: 500px;
        }

        .news-image img {
            width: 100%;
            height: auto;
            max-height: 280px;
            object-fit: cover;
            border-radius: 4px;
        }

        .news-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .news-title {
            font-size: 2.5rem;
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .news-desc {
            margin-top: 20px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            opacity: 0.5;
            line-height: 1.6;
        }

        .news-date {
            margin-top: 10px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.4;
        }

        /* Right panel - mission clock + bus */
        .right-panel {
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Mission clock */
        .mission-clock {
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
        }

        .clock-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.5;
            margin-bottom: 10px;
        }

        .clock-time {
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
        }

        .clock-status {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
            margin-top: 15px;
        }

        /* Bus panel */
        .bus-panel {
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 16px;
            padding: 20px;
        }

        .bus-header {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.5;
            margin-bottom: 20px;
        }

        .bus-list {
            display: block;
        }

        .bus-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .bus-item:last-child {
            border-bottom: none;
        }

        .bus-route {
            font-size: 1rem;
            font-weight: 600;
        }

        .bus-type {
            font-size: 0.65rem;
            opacity: 0.4;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bus-time {
            font-size: 1rem;
            font-weight: 300;
        }

        .bus-empty {
            opacity: 0.3;
            font-size: 0.85rem;
            text-align: center;
            padding: 20px 0;
        }

        /* Substitutions panel */
        .substitutions-panel {
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 16px;
            padding: 20px;
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .substitutions-scroll-container {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .substitutions-list {
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .substitutions-header {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.5;
            margin-bottom: 15px;
        }

        .substitutions-item {
            padding: 10px;
            margin-bottom: 8px;
            background: rgba(255,100,100,0.1);
            border-left: 3px solid rgba(255,100,100,0.6);
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .substitutions-item:last-child {
            margin-bottom: 0;
        }

        .substitutions-item.cancelled {
            border-left-color: #ef4444;
            background: rgba(239,68,68,0.1);
        }

        .substitutions-item.added {
            border-left-color: #22c55e;
            background: rgba(34,197,94,0.1);
        }

        .substitutions-item.room_change {
            border-left-color: #eab308;
            background: rgba(234,179,8,0.1);
        }

        .substitutions-item.substitute {
            border-left-color: #3b82f6;
            background: rgba(59,130,246,0.1);
        }

        .substitutions-item .class-info {
            font-weight: 600;
        }

        .substitutions-item .details {
            opacity: 0.7;
            font-size: 0.75rem;
            margin-top: 4px;
        }

        .substitutions-empty {
            opacity: 0.3;
            font-size: 0.85rem;
            text-align: center;
            padding: 20px 0;
        }

        .loading {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            opacity: 0.3;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .sleep-screen {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
        }

        .sleep-screen.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="space-bg"></div>
    <div class="sleep-screen" id="sleepScreen"></div>

    <div class="container">
        <header>
            <div class="top-timeline" id="topTimeline">
                <div class="top-timeline-track">
                    <div class="top-timeline-periods" id="topTimelinePeriods"></div>
                    <div class="top-timeline-marker" id="topTimelineMarker">
                        <div class="top-timeline-now" id="topTimelineNow">NOW</div>
                    </div>
                </div>
                <div class="top-timeline-labels" id="topTimelineLabels"></div>
            </div>
        </header>

        <div class="main-content">
            <div class="progress-vertical">
                <div class="bar" id="bar"></div>
            </div>

            <div class="news-scroll-container" id="scrollContainer">
                <div class="news-scroll" id="newsScroll">
                    <div class="loading" id="loadingText">Loading...</div>
                </div>
            </div>

            <div class="right-panel">
                <div class="mission-clock">
                    <div class="clock-label" id="clockLabel">Lesson starts in</div>
                    <div class="clock-time" id="clockTime">--:--</div>
                    <div class="clock-status" id="clockStatus">Loading schedule...</div>
                </div>

                <div class="bus-panel">
                    <div class="bus-header">Lepistiku</div>
                    <div class="bus-list" id="busList">
                        <div class="bus-empty">Loading...</div>
                    </div>
                </div>

                <div class="substitutions-panel" id="substitutionsPanel" style="display: none;">
                    <div class="substitutions-header" data-i18n="substitutions">Substitutions</div>
                    <div class="substitutions-scroll-container">
                        <div class="substitutions-list" id="substitutionsList">
                            <div class="substitutions-empty" data-i18n="noSubstitutions">No changes today</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/i18n.js"></script>
    <script>
        const PAUSE_TIME = 12000;
        const SCROLL_DURATION = 800;
        const REFRESH_TIME = 15 * 60 * 1000;
        const BUS_REFRESH = 60 * 1000;

        // Display hours config
        let DISPLAY_HOURS = {
            enabled: true,
            start: '06:00',
            end: '17:00'
        };

        // Substitutions config (loaded from settings)
        let SUBSTITUTIONS_CONFIG = {
            enabled: true,
            refresh_minutes: 15,
            filter_mode: 'upcoming',
            display_windows: [{ start: '07:00', end: '10:00' }]
        };

        // School schedule - loaded from settings API
        let SCHEDULE = [
            { start: '08:00', end: '08:45', name: 'Period 1' },
            { start: '08:55', end: '09:40', name: 'Period 2' },
            { start: '09:50', end: '10:35', name: 'Period 3' },
            { start: '10:45', end: '11:30', name: 'Period 4' },
            { start: '12:00', end: '12:45', name: 'Period 5' },
            { start: '13:15', end: '14:00', name: 'Period 6' },
            { start: '14:10', end: '14:55', name: 'Period 7' },
            { start: '15:00', end: '15:45', name: 'Period 8' },
        ];

        // Demo mode
        let DEMO_MODE = false;
        let demoTime = null;
        let COLORS = {
            lesson: '#ffffff',
            break: '#22c55e',
            before_school: '#3b82f6',
            after_school: '#6b7280'
        };
        let DEMO_SPEED = 60;

        function getDemoTime() {
            if (!DEMO_MODE || !demoTime) return new Date();
            return new Date(demoTime.getTime());
        }

        function startDemoTime() {
            // Start at 05:55 to see sleep->wake transition
            demoTime = new Date();
            demoTime.setHours(5, 55, 0, 0);
            // Make it a weekday (Monday)
            while (demoTime.getDay() === 0 || demoTime.getDay() === 6) {
                demoTime.setDate(demoTime.getDate() + 1);
            }
            const demoDate = demoTime.getDate();

            // Smooth updates at 20fps, DEMO_SPEED = how many seconds pass per real second
            const FPS = 20;
            const msPerTick = 1000 / FPS;
            setInterval(() => {
                demoTime.setTime(demoTime.getTime() + DEMO_SPEED * msPerTick);
                // Reset at midnight (when date changes)
                if (demoTime.getDate() !== demoDate) {
                    demoTime.setDate(demoDate);
                    demoTime.setHours(0, 0, 0, 0);
                }
            }, msPerTick);
        }

        // Load settings from API
        async function loadSettings() {
            try {
                const res = await fetch('/api/settings');
                const settings = await res.json();

                // Initialize i18n
                I18N.init(settings.language || 'en');
                applyTranslations();

                SCHEDULE = settings.schedule || SCHEDULE;
                DEMO_MODE = settings.demo_mode === true;
                DEMO_SPEED = settings.demo_speed || 60;
                if (settings.colors) {
                    COLORS = { ...COLORS, ...settings.colors };
                }

                if (DEMO_MODE) {
                    startDemoTime();
                    console.log('Demo mode: ' + DEMO_SPEED + 'x');
                }

                initTopTimeline();
                startUIUpdates();

                // Update bus stop name
                document.querySelector('.bus-header').textContent = settings.bus_stop_name || 'Bus Stop';

                // Hide bus panel if disabled
                const busPanel = document.querySelector('.bus-panel');
                if (settings.bus_enabled === false) {
                    busPanel.style.display = 'none';
                } else {
                    busPanel.style.display = '';
                }

                // Load substitutions config
                if (settings.substitutions) {
                    SUBSTITUTIONS_CONFIG = settings.substitutions;
                }

                // Load display hours
                if (settings.display_hours) {
                    DISPLAY_HOURS = settings.display_hours;
                }
            } catch (e) {
                console.error('Failed to load settings');
            }
        }

        // Apply translations to static elements
        function applyTranslations() {
            const loadingText = document.getElementById('loadingText');
            if (loadingText) loadingText.textContent = I18N.t('loading');

            const clockStatus = document.getElementById('clockStatus');
            if (clockStatus) clockStatus.textContent = I18N.t('loadingSchedule');

            // Translate substitutions header
            const subsHeader = document.querySelector('.substitutions-header');
            if (subsHeader) subsHeader.textContent = I18N.t('substitutions');
        }

        loadSettings();

        // Keyboard shortcut: S for settings
        document.addEventListener('keydown', (e) => {
            if (e.key === 's' || e.key === 'S') {
                window.location.href = '/settings';
            }
        });

        let articles = [];
        let currentStep = 0;
        let totalSteps = 0;
        let itemHeight = 0;

        // === SUBSTITUTIONS ===
        function isPeriodEnded(periodNum) {
            const now = getDemoTime();
            const currentMin = now.getHours() * 60 + now.getMinutes();

            // Find the period in schedule
            const period = SCHEDULE[periodNum - 1];
            if (!period) return false;

            const [endH, endM] = period.end.split(':').map(Number);
            const endMin = endH * 60 + endM;

            return currentMin > endMin;
        }

        function getNextPeriod() {
            const now = getDemoTime();
            const currentMin = now.getHours() * 60 + now.getMinutes();

            for (let i = 0; i < SCHEDULE.length; i++) {
                const [endH, endM] = SCHEDULE[i].end.split(':').map(Number);
                const endMin = endH * 60 + endM;
                if (currentMin <= endMin) return i + 1; // Period numbers are 1-based
            }
            return null; // All periods ended
        }

        // Store raw substitutions for re-filtering
        let rawSubstitutions = [];

        async function fetchSubstitutions() {
            if (!SUBSTITUTIONS_CONFIG.enabled) return;

            try {
                const res = await fetch('/api/substitutions');
                rawSubstitutions = await res.json();
                renderSubstitutions(rawSubstitutions);
            } catch (e) {
                console.error('Substitutions error:', e);
            }
        }

        function renderSubstitutions(subs) {
            const list = document.getElementById('substitutionsList');
            const filterMode = SUBSTITUTIONS_CONFIG.filter_mode || 'upcoming';

            // Filter based on mode
            let filtered = subs || [];
            if (filterMode === 'upcoming') {
                filtered = filtered.filter(s => !isPeriodEnded(s.period));
            } else if (filterMode === 'next') {
                const nextPeriod = getNextPeriod();
                filtered = nextPeriod ? filtered.filter(s => s.period === nextPeriod) : [];
            }
            // filterMode === 'all' shows everything

            // Sort by period number
            filtered.sort((a, b) => a.period - b.period);

            if (!filtered.length) {
                // Show appropriate message based on filter mode
                let emptyMsg;
                if (filterMode === 'upcoming') {
                    emptyMsg = I18N.t('noUpcomingSubstitutions');
                } else if (filterMode === 'next') {
                    emptyMsg = I18N.t('noNextSubstitutions');
                } else {
                    emptyMsg = I18N.t('noSubstitutions');
                }
                list.innerHTML = `<div class="substitutions-empty">${emptyMsg}</div>`;
                return;
            }

            list.innerHTML = filtered.map(s => `
                <div class="substitutions-item ${s.type}">
                    <div class="class-info">${s.period}. ${s.class || ''}: ${s.subject}</div>
                    <div class="details">${s.status}${s.room ? ' \u2022 ' + s.room : ''}</div>
                </div>
            `).join('');
        }

        function updateSubstitutionsVisibility() {
            const panel = document.getElementById('substitutionsPanel');
            if (!SUBSTITUTIONS_CONFIG.enabled) {
                panel.style.display = 'none';
                return;
            }

            const now = getDemoTime();
            const currentMin = now.getHours() * 60 + now.getMinutes();
            const day = now.getDay();

            // Hide on weekends
            if (day === 0 || day === 6) {
                panel.style.display = 'none';
                return;
            }

            // Check if within any display window
            const windows = SUBSTITUTIONS_CONFIG.display_windows || [];
            const shouldShow = windows.some(w => {
                const [startH, startM] = w.start.split(':').map(Number);
                const [endH, endM] = w.end.split(':').map(Number);
                const start = startH * 60 + startM;
                const end = endH * 60 + endM;
                return currentMin >= start && currentMin <= end;
            });

            panel.style.display = shouldShow ? 'flex' : 'none';
            panel.style.flexDirection = 'column';
        }

        // Auto-scroll substitutions
        let subsScrollPos = 0;
        let subsScrollDir = 1;
        const SUBS_SCROLL_PAUSE = 3000;
        const SUBS_SCROLL_SPEED = 800;

        function autoScrollSubstitutions() {
            const list = document.getElementById('substitutionsList');
            const container = document.querySelector('.substitutions-scroll-container');
            const panel = document.getElementById('substitutionsPanel');
            if (!list || !container || !panel || panel.style.display === 'none') return;

            const listHeight = list.scrollHeight;
            const containerHeight = container.clientHeight;

            // Only scroll if content overflows
            if (listHeight <= containerHeight) {
                list.style.transform = 'translateY(0)';
                return;
            }

            const maxScroll = listHeight - containerHeight;

            // Move in current direction
            if (subsScrollDir === 1) {
                subsScrollPos += containerHeight * 0.8;
                if (subsScrollPos >= maxScroll) {
                    subsScrollPos = maxScroll;
                    subsScrollDir = -1;
                }
            } else {
                subsScrollPos -= containerHeight * 0.8;
                if (subsScrollPos <= 0) {
                    subsScrollPos = 0;
                    subsScrollDir = 1;
                }
            }

            list.style.transform = `translateY(-${subsScrollPos}px)`;
        }

        // Mission clock
        function getNextSchoolDay(from) {
            const date = new Date(from);
            const day = date.getDay();

            // If weekend or after school, find next school day
            if (day === 0) { // Sunday
                date.setDate(date.getDate() + 1);
            } else if (day === 6) { // Saturday
                date.setDate(date.getDate() + 2);
            } else if (day >= 1 && day <= 4) { // Mon-Thu after school
                date.setDate(date.getDate() + 1);
            } else { // Friday after school
                date.setDate(date.getDate() + 3);
            }

            // Set to first period start
            const [h, m] = SCHEDULE[0].start.split(':').map(Number);
            date.setHours(h, m, 0, 0);
            return date;
        }

        function formatCountdown(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const days = Math.floor(totalSeconds / 86400);
            const hours = Math.floor((totalSeconds % 86400) / 3600);
            const mins = Math.floor((totalSeconds % 3600) / 60);
            const secs = totalSeconds % 60;

            if (days > 0) {
                return `${days}D ${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
            }
            if (hours > 0) {
                return `${hours}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function getDayName(date) {
            return I18N.getDayName(date.getDay());
        }

        function applyStateColor(state) {
            const color = COLORS[state] || COLORS.lesson;
            const missionClock = document.querySelector('.mission-clock');

            if (missionClock) {
                missionClock.style.borderColor = color;
            }
        }

        function updateMissionClock() {
            const now = getDemoTime();
            const day = now.getDay();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            const currentSeconds = now.getSeconds();

            const label = document.getElementById('clockLabel');
            const time = document.getElementById('clockTime');
            const status = document.getElementById('clockStatus');

            // Weekend check
            if (day === 0 || day === 6) {
                const nextSchool = getNextSchoolDay(now);
                const remaining = nextSchool - now;

                label.textContent = I18N.t('schoolStartsIn');
                time.textContent = formatCountdown(remaining);
                status.textContent = getDayName(nextSchool) + ' 08:00';
                applyStateColor('after_school');
                return;
            }

            // Check if before first period
            const [firstStartH, firstStartM] = SCHEDULE[0].start.split(':').map(Number);
            const firstPeriodStart = firstStartH * 60 + firstStartM;
            if (currentMinutes < firstPeriodStart) {
                const remaining = (firstPeriodStart - currentMinutes - 1) * 60 + (60 - currentSeconds);
                const mins = Math.floor(remaining / 60);
                const secs = remaining % 60;

                label.textContent = I18N.t('schoolStartsIn');
                time.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                status.textContent = I18N.formatPeriod(1) + ' ' + I18N.t('upcoming');
                applyStateColor('before_school');
                return;
            }

            // Find current or next period
            for (let i = 0; i < SCHEDULE.length; i++) {
                const period = SCHEDULE[i];
                const [startH, startM] = period.start.split(':').map(Number);
                const [endH, endM] = period.end.split(':').map(Number);
                const startMinutes = startH * 60 + startM;
                const endMinutes = endH * 60 + endM;

                // Currently in this period
                if (currentMinutes >= startMinutes && currentMinutes < endMinutes) {
                    const remaining = (endMinutes - currentMinutes - 1) * 60 + (60 - currentSeconds);
                    const mins = Math.floor(remaining / 60);
                    const secs = remaining % 60;

                    label.textContent = I18N.t('breakIn');
                    time.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                    status.textContent = I18N.formatPeriod(i + 1) + ' ' + I18N.t('inProgress');
                    applyStateColor('lesson');
                    return;
                }

                // Between periods (break time)
                if (i < SCHEDULE.length - 1) {
                    const nextPeriod = SCHEDULE[i + 1];
                    const [nextStartH, nextStartM] = nextPeriod.start.split(':').map(Number);
                    const nextStartMinutes = nextStartH * 60 + nextStartM;

                    if (currentMinutes >= endMinutes && currentMinutes < nextStartMinutes) {
                        const remaining = (nextStartMinutes - currentMinutes - 1) * 60 + (60 - currentSeconds);
                        const mins = Math.floor(remaining / 60);
                        const secs = remaining % 60;

                        label.textContent = I18N.t('lessonStartsIn');
                        time.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                        status.textContent = I18N.formatPeriod(i + 2) + ' ' + I18N.t('upcoming');
                        applyStateColor('break');
                        return;
                    }
                }
            }

            // After all periods on a weekday
            const nextSchool = getNextSchoolDay(now);
            const remaining = nextSchool - now;

            label.textContent = I18N.t('schoolStartsIn');
            time.textContent = formatCountdown(remaining);
            status.textContent = getDayName(nextSchool) + ' 08:00';
            applyStateColor('after_school');
        }

        // Top Timeline
        const DAY_START = 8 * 60; // 08:00 in minutes
        const DAY_END = 15 * 60 + 45; // 15:45 in minutes
        const DAY_DURATION = DAY_END - DAY_START;

        function initTopTimeline() {
            const container = document.getElementById('topTimelinePeriods');
            const labels = document.getElementById('topTimelineLabels');
            let html = '';
            let lastEnd = DAY_START;

            SCHEDULE.forEach((period, i) => {
                const [startH, startM] = period.start.split(':').map(Number);
                const [endH, endM] = period.end.split(':').map(Number);
                const startMin = startH * 60 + startM;
                const endMin = endH * 60 + endM;

                // Break before this period
                if (startMin > lastEnd) {
                    const breakWidth = ((startMin - lastEnd) / DAY_DURATION) * 100;
                    html += `<div class="top-timeline-break" style="width:${breakWidth}%"></div>`;
                }

                // Period block
                const periodWidth = ((endMin - startMin) / DAY_DURATION) * 100;
                html += `<div class="top-timeline-period" data-period="${i}" style="width:${periodWidth}%"></div>`;

                lastEnd = endMin;
            });

            container.innerHTML = html;

            // Generate labels positioned by actual time
            let labelsHtml = '';
            SCHEDULE.forEach((p, i) => {
                const [h, m] = p.start.split(':').map(Number);
                const startMin = h * 60 + m;
                const percent = ((startMin - DAY_START) / DAY_DURATION) * 100;
                labelsHtml += `<span style="position:absolute;left:${percent}%;transform:translateX(-50%)">${p.start}</span>`;
            });
            // End time label at 100%
            labelsHtml += `<span style="position:absolute;left:100%;transform:translateX(-50%)">15:45</span>`;
            labels.innerHTML = labelsHtml;
        }

        function updateTopTimeline() {
            const now = getDemoTime();
            const currentMin = now.getHours() * 60 + now.getMinutes();
            const day = now.getDay();

            const timeline = document.getElementById('topTimeline');
            const marker = document.getElementById('topTimelineMarker');
            const nowLabel = document.getElementById('topTimelineNow');

            // Dim timeline on weekends or outside school hours
            if (day === 0 || day === 6 || currentMin < DAY_START || currentMin > DAY_END) {
                timeline.style.opacity = '0.3';
                marker.style.display = 'none';
                return;
            }

            timeline.style.opacity = '1';
            marker.style.display = 'block';

            // Calculate progress
            const elapsed = currentMin - DAY_START;
            const percent = Math.min(100, Math.max(0, (elapsed / DAY_DURATION) * 100));

            marker.style.left = percent + '%';

            // Show current time on marker
            const hours = now.getHours();
            const mins = now.getMinutes();
            nowLabel.textContent = `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;

            // Highlight active period
            document.querySelectorAll('.top-timeline-period').forEach((el, i) => {
                const period = SCHEDULE[i];
                const [startH, startM] = period.start.split(':').map(Number);
                const [endH, endM] = period.end.split(':').map(Number);
                const startMin = startH * 60 + startM;
                const endMin = endH * 60 + endM;

                if (currentMin >= startMin && currentMin < endMin) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }

        // Update UI - faster in demo mode for smooth animation
        function startUIUpdates() {
            const interval = DEMO_MODE ? 50 : 1000;
            setInterval(updateTopTimeline, interval);
            setInterval(updateMissionClock, interval);

            // Time-sensitive updates - faster in demo mode
            const slowInterval = DEMO_MODE ? 200 : 1000;
            setInterval(updateSubstitutionsVisibility, slowInterval);
            setInterval(updateSleepScreen, slowInterval);

            // Substitutions filtering - check every 500ms in demo, 60s in real
            const subsInterval = DEMO_MODE ? 500 : 60000;
            setInterval(() => renderSubstitutions(rawSubstitutions), subsInterval);

            updateTopTimeline();
            updateMissionClock();
            updateSubstitutionsVisibility();
            updateSleepScreen();
        }

        async function fetchArticles() {
            try {
                const res = await fetch('/api/articles');
                articles = await res.json();
                if (articles.length) render();
            } catch (e) {
                console.error('Fetch error:', e);
            }
        }

        async function fetchBus() {
            try {
                const res = await fetch('/api/bus');
                const buses = await res.json();
                renderBus(buses);
            } catch (e) {
                console.error('Bus error:', e);
            }
        }

        function renderBus(buses) {
            const list = document.getElementById('busList');

            if (!buses.length) {
                list.innerHTML = `<div class="bus-empty">${I18N.t('noBuses')}</div>`;
                return;
            }

            list.innerHTML = buses.map(b => `
                <div class="bus-item">
                    <div>
                        <div class="bus-route">${b.route}${b.destination ? ' \u2192 ' + b.destination : ''}</div>
                        <div class="bus-type">${I18N.getTransportType(b.type)}</div>
                    </div>
                    <div class="bus-time">${b.time}</div>
                </div>
            `).join('');
        }

        function render() {
            const scroll = document.getElementById('newsScroll');

            scroll.innerHTML = articles.map(article => `
                <div class="news-item">
                    <div class="news-image">
                        ${article.image ? `<img src="${article.image}" alt="">` : ''}
                    </div>
                    <div class="news-content">
                        <div class="news-title">${article.title}</div>
                        ${article.description ? `<div class="news-desc">${article.description}</div>` : ''}
                        ${article.date ? `<div class="news-date">${article.date}</div>` : ''}
                    </div>
                </div>
            `).join('');

            setTimeout(() => {
                const items = scroll.querySelectorAll('.news-item');
                if (items.length > 0) {
                    itemHeight = items[0].offsetHeight + 60;
                }
                totalSteps = Math.ceil(articles.length / 2);
                currentStep = 0;
                updateProgressBar();
                startStepScroll();
            }, 500);
        }

        function updateProgressBar() {
            const bar = document.getElementById('bar');
            const progress = totalSteps > 1 ? (currentStep / (totalSteps - 1)) * 100 : 0;
            bar.style.height = progress + '%';
        }

        function scrollToStep(step) {
            const scroll = document.getElementById('newsScroll');
            const targetY = step * itemHeight * 2;
            scroll.style.transform = `translateY(-${targetY}px)`;
            updateProgressBar();
        }

        function startStepScroll() {
            setInterval(() => {
                currentStep++;
                if (currentStep >= totalSteps) {
                    currentStep = 0;
                    const scroll = document.getElementById('newsScroll');
                    scroll.style.transition = 'none';
                    scroll.style.transform = 'translateY(0)';
                    updateProgressBar();
                    setTimeout(() => {
                        scroll.style.transition = `transform ${SCROLL_DURATION}ms cubic-bezier(0.16, 1, 0.3, 1)`;
                    }, 50);
                } else {
                    scrollToStep(currentStep);
                }
            }, PAUSE_TIME);
        }

        // Display hours - sleep screen when outside hours
        function updateSleepScreen() {
            if (!DISPLAY_HOURS.enabled) {
                document.getElementById('sleepScreen').classList.remove('active');
                return;
            }

            const now = getDemoTime();
            const currentMin = now.getHours() * 60 + now.getMinutes();
            const [startH, startM] = DISPLAY_HOURS.start.split(':').map(Number);
            const [endH, endM] = DISPLAY_HOURS.end.split(':').map(Number);
            const startMin = startH * 60 + startM;
            const endMin = endH * 60 + endM;

            const isAwake = currentMin >= startMin && currentMin < endMin;
            document.getElementById('sleepScreen').classList.toggle('active', !isAwake);
        }

        // Fetch data from APIs (real-time intervals, not affected by demo mode)
        fetchArticles();
        fetchBus();
        fetchSubstitutions();
        setInterval(fetchArticles, REFRESH_TIME);           // 15 min
        setInterval(fetchBus, BUS_REFRESH);                 // 1 min
        setInterval(fetchSubstitutions, (SUBSTITUTIONS_CONFIG.refresh_minutes || 15) * 60 * 1000);
        setInterval(autoScrollSubstitutions, SUBS_SCROLL_PAUSE);
    </script>
</body>
</html>
