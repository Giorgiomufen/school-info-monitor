<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tehnikagümnaasium - News (Scroll Test)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 40px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 { font-size: 2.5rem; font-weight: 300; }

        .main-content {
            flex: 1;
            display: flex;
            gap: 30px;
            min-height: 0;
            overflow: hidden;
        }

        /* Vertical progress bar */
        .progress-vertical {
            width: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-vertical .bar {
            width: 100%;
            background: #3b82f6;
            height: 0%;
            transition: height 0.1s linear;
        }

        /* News scroll area */
        .news-scroll-container {
            flex: 3;
            overflow: hidden;
            position: relative;
        }

        .news-scroll {
            display: flex;
            flex-direction: column;
            gap: 30px;
            transition: transform 0.5s ease-out;
        }

        .news-item {
            display: flex;
            gap: 30px;
            min-height: 0;
        }

        .news-image {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .news-image img {
            max-width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 12px;
        }

        .news-content {
            flex: 1;
            display: flex;
            align-items: center;
        }

        .news-title {
            font-size: 2rem;
            font-weight: 600;
            line-height: 1.3;
        }

        /* Bus panel */
        .bus-panel {
            flex: 1;
            max-width: 280px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 25px;
            display: flex;
            flex-direction: column;
        }

        .bus-header {
            font-size: 1.1rem;
            opacity: 0.7;
            margin-bottom: 15px;
        }

        .bus-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bus-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }

        .bus-route {
            font-size: 1.4rem;
            font-weight: 600;
        }

        .bus-type {
            font-size: 0.85rem;
            opacity: 0.6;
        }

        .bus-time {
            font-size: 1.2rem;
            color: #4ade80;
        }

        .bus-empty {
            opacity: 0.4;
            text-align: center;
            padding: 20px;
        }

        .loading {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Tallinna Tehnikagümnaasium</h1>
        </header>

        <div class="main-content">
            <div class="progress-vertical">
                <div class="bar" id="bar"></div>
            </div>

            <div class="news-scroll-container" id="scrollContainer">
                <div class="news-scroll" id="newsScroll">
                    <div class="loading">Loading news...</div>
                </div>
            </div>

            <div class="bus-panel">
                <div class="bus-header">
                    <span>Lepistiku stop</span>
                </div>
                <div class="bus-list" id="busList">
                    <div class="bus-empty">Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const PAUSE_TIME = 15000; // Time to show each pair of news
        const SCROLL_DURATION = 1000; // Scroll animation duration
        const REFRESH_TIME = 15 * 60 * 1000;
        const BUS_REFRESH = 60 * 1000;

        // Demo articles when API returns empty
        const DEMO_ARTICLES = [
            { title: "Tehnikagümnaasium võitis robootikavõistluse", image: "https://picsum.photos/600/400?random=1" },
            { title: "Uus õppeaasta algab 1. septembril", image: "https://picsum.photos/600/400?random=2" },
            { title: "Kooli spordipäev toimub järgmisel nädalal", image: "https://picsum.photos/600/400?random=3" },
            { title: "IT-klassi õpilased osalesid häkatonil", image: "https://picsum.photos/600/400?random=4" },
            { title: "Koolimaja remont valmis", image: "https://picsum.photos/600/400?random=5" }
        ];

        let articles = [];
        let currentStep = 0;
        let totalSteps = 0;
        let itemHeight = 0;

        async function fetchArticles() {
            try {
                const res = await fetch('/api/articles');
                articles = await res.json();
                if (!articles.length) {
                    console.log('Using demo articles');
                    articles = DEMO_ARTICLES;
                }
                render();
            } catch (e) {
                console.error('Fetch error:', e);
                articles = DEMO_ARTICLES;
                render();
            }
        }

        async function fetchBus() {
            try {
                const res = await fetch('/api/bus');
                const buses = await res.json();
                renderBus(buses);
            } catch (e) {
                console.error('Bus error:', e);
            }
        }

        function renderBus(buses) {
            const list = document.getElementById('busList');

            if (!buses.length) {
                list.innerHTML = '<div class="bus-empty">No buses currently</div>';
                return;
            }

            list.innerHTML = buses.map(b => `
                <div class="bus-item">
                    <div>
                        <div class="bus-route">${b.route}</div>
                        <div class="bus-type">${b.type}</div>
                    </div>
                    <div class="bus-time">${b.time}</div>
                </div>
            `).join('');
        }

        function render() {
            const scroll = document.getElementById('newsScroll');
            const container = document.getElementById('scrollContainer');

            scroll.innerHTML = articles.map(article => `
                <div class="news-item">
                    <div class="news-image">
                        ${article.image ? `<img src="${article.image}" alt="">` : ''}
                    </div>
                    <div class="news-content">
                        <div class="news-title">${article.title}</div>
                    </div>
                </div>
            `).join('');

            // Wait for images to load, then calculate steps
            setTimeout(() => {
                const items = scroll.querySelectorAll('.news-item');
                if (items.length > 0) {
                    // Get height of 2 items (including gap)
                    itemHeight = items[0].offsetHeight + 30; // 30 is the gap
                }
                // Steps = how many times we scroll by 2 items
                totalSteps = Math.ceil(articles.length / 2);
                currentStep = 0;
                updateProgressBar();
                startStepScroll();
            }, 500);
        }

        function updateProgressBar() {
            const bar = document.getElementById('bar');
            const progress = totalSteps > 1 ? (currentStep / (totalSteps - 1)) * 100 : 0;
            bar.style.height = progress + '%';
        }

        function scrollToStep(step) {
            const scroll = document.getElementById('newsScroll');
            const targetY = step * itemHeight * 2; // 2 items per step
            scroll.style.transition = `transform ${SCROLL_DURATION}ms ease-out`;
            scroll.style.transform = `translateY(-${targetY}px)`;
            updateProgressBar();
        }

        function startStepScroll() {
            setInterval(() => {
                currentStep++;
                if (currentStep >= totalSteps) {
                    currentStep = 0;
                    // Instant jump back to top
                    const scroll = document.getElementById('newsScroll');
                    scroll.style.transition = 'none';
                    scroll.style.transform = 'translateY(0)';
                    updateProgressBar();
                } else {
                    scrollToStep(currentStep);
                }
            }, PAUSE_TIME);
        }

        // Start
        fetchArticles();
        fetchBus();
        setInterval(fetchArticles, REFRESH_TIME);
        setInterval(fetchBus, BUS_REFRESH);
    </script>
</body>
</html>
