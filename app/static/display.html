<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tehnikagümnaasium - News</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 40px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 { font-size: 2.5rem; font-weight: 300; }

        .counter {
            font-size: 1.2rem;
            opacity: 0.6;
        }

        .main-content {
            flex: 1;
            display: flex;
            gap: 30px;
            min-height: 0;
        }

        .slide-area {
            flex: 3;
            display: flex;
            gap: 40px;
        }

        .slide-image {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .slide-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .slide-title {
            font-size: 3rem;
            font-weight: 600;
            line-height: 1.2;
        }

        .dots {
            display: flex;
            gap: 8px;
            margin-top: 30px;
        }

        .dots span {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
        }

        .dots span.active { background: #3b82f6; }

        /* Bus panel */
        .bus-panel {
            flex: 1;
            max-width: 280px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 25px;
            display: flex;
            flex-direction: column;
        }

        .bus-header {
            font-size: 1.1rem;
            opacity: 0.7;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bus-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bus-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }

        .bus-route {
            font-size: 1.4rem;
            font-weight: 600;
        }

        .bus-type {
            font-size: 0.85rem;
            opacity: 0.6;
        }

        .bus-time {
            font-size: 1.2rem;
            color: #4ade80;
        }

        .bus-empty {
            opacity: 0.4;
            text-align: center;
            padding: 20px;
        }

        .progress {
            height: 4px;
            background: rgba(255,255,255,0.1);
            margin-top: 30px;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress .bar {
            height: 100%;
            background: #3b82f6;
            width: 0%;
        }

        .loading {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Tallinna Tehnikagümnaasium</h1>
            <div class="counter" id="counter"></div>
        </header>

        <div class="main-content">
            <div class="slide-area" id="slide">
                <div class="loading">Loading news...</div>
            </div>

            <div class="bus-panel">
                <div class="bus-header">
                    <span>Lepistiku stop</span>
                </div>
                <div class="bus-list" id="busList">
                    <div class="bus-empty">Loading...</div>
                </div>
            </div>
        </div>

        <div class="progress">
            <div class="bar" id="bar"></div>
        </div>
    </div>

    <script>
        const SLIDE_TIME = 20000;
        const REFRESH_TIME = 15 * 60 * 1000;
        const BUS_REFRESH = 60 * 1000;

        let articles = [];
        let current = 0;

        async function fetchArticles() {
            try {
                const res = await fetch('/api/articles');
                articles = await res.json();
                if (articles.length) render();
            } catch (e) {
                console.error('Fetch error:', e);
            }
        }

        async function fetchBus() {
            try {
                const res = await fetch('/api/bus');
                const buses = await res.json();
                renderBus(buses);
            } catch (e) {
                console.error('Bus error:', e);
            }
        }

        function renderBus(buses) {
            const list = document.getElementById('busList');

            if (!buses.length) {
                list.innerHTML = '<div class="bus-empty">No buses currently</div>';
                return;
            }

            list.innerHTML = buses.map(b => `
                <div class="bus-item">
                    <div>
                        <div class="bus-route">${b.route}</div>
                        <div class="bus-type">${b.type}</div>
                    </div>
                    <div class="bus-time">${b.time}</div>
                </div>
            `).join('');
        }

        function render() {
            const slide = document.getElementById('slide');
            const counter = document.getElementById('counter');
            const article = articles[current];

            counter.textContent = `${current + 1} / ${articles.length}`;

            slide.innerHTML = `
                <div class="slide-image">
                    ${article.image ? `<img src="${article.image}" alt="">` : ''}
                </div>
                <div class="slide-content">
                    <div class="slide-title">${article.title}</div>
                    <div class="dots">
                        ${articles.map((_, i) => `<span class="${i === current ? 'active' : ''}"></span>`).join('')}
                    </div>
                </div>
            `;

            animateProgress();
        }

        function animateProgress() {
            const bar = document.getElementById('bar');
            bar.style.transition = 'none';
            bar.style.width = '0%';
            setTimeout(() => {
                bar.style.transition = `width ${SLIDE_TIME}ms linear`;
                bar.style.width = '100%';
            }, 50);
        }

        function nextSlide() {
            if (!articles.length) return;
            current = (current + 1) % articles.length;
            render();
        }

        // Start
        fetchArticles();
        fetchBus();
        setInterval(nextSlide, SLIDE_TIME);
        setInterval(fetchArticles, REFRESH_TIME);
        setInterval(fetchBus, BUS_REFRESH);
    </script>
</body>
</html>
